<article class="news-item">
    <figure class="news-figure"><img src={{item.image}} alt=""></figure>
    <div class="news-description">
        <h3>{{item.title}}</h3>
        <p>{{item.subtitle}}</p>
        <h6>{{item.min}}min READ</h6>
        @if (userRole) {
        <button (click)="setId(item.id)" [routerLink]="['/admin', userRole, 'edit-article']"> <i class="fa-solid fa-pen-to-square"></i>   Edit</button>
        }
    </div>
    
</article>
