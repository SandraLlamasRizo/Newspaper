
<div class="modal-content">
    <a class="back" [routerLink]="['/admin/writer']"> <i class="fa-solid fa-arrow-left"></i> back</a>
        <h2>Create a New Article</h2>

        <form [formGroup]="articleForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" formControlName="title">
                @if(!titleValid) {
                <p class="validator">Empty field</p>
                }
            </div>

            <div class="form-group">
                <label for="subtitle">Subtitle</label>
                <input type="text" id="subtitle" formControlName="subtitle">
                @if(!subtitleValid) {
                <p class="validator">Empty field</p>
                }
            </div>

            <div class="form-group">
                <label for="image">Image URL</label>
                <input type="text" id="image" formControlName="image">
                @if(!imageValid) {
                <p class="validator">Empty field</p>
                }
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" formControlName="description" rows="6"></textarea>
                @if(!descriptionValid) {
                <p class="validator">Empty field</p>
                }
            </div>

            <div class="form-group">
                <label for="min">Reading Time (minutes)</label>
                <input type="number" id="min" formControlName="min" min="1">
                @if(!minValid) {
                <p class="validator">Empty field</p>
                }
            </div>

            <div class="form-group">
                <label for="section">Section</label>
                <select id="section" formControlName="section">
                    <option value="">Select a section</option>
                    @for (sec of sections; track $index) {
                        <option value={{sec.name}}>{{sec.name}}</option>
                    }
                </select>
                @if(!sectionValid) {
                <p class="validator">Empty field</p>
                }
            </div>

            <div class="button-group">
                <button class="draft" type="submit" (click)="handleState('Draft')">Save draft</button> 
                <button class="delete" (click)="deleteArticle()"><i class="fa-solid fa-trash"></i> Delete</button>
            </div>           
            <button class="submit" type="submit" (click)="handleState('Revision')">Send for revision</button>
        </form>
    </div>
